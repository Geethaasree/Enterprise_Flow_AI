# Traefik — EnterpriseFlow public routes
# Install: sudo tee /data/coolify/proxy/dynamic/enterpriseflow.yaml < deploy/traefik-enterpriseflow.yaml
#
# App: /ef  (Next basePath). Root / redirects to /ef/login so bare IP is not "no available server".

http:
  middlewares:
    ef-root-to-login:
      redirectRegex:
        regex: ^https?://([^/]+)/?$
        replacement: http://${1}/ef/login
        permanent: false

  routers:
    # bare https://IP/ and http://IP/ → login (beats Coolify catchall 503)
    enterpriseflow-root-http:
      rule: Path(`/`)
      entryPoints:
        - http
      middlewares:
        - ef-root-to-login
      service: enterpriseflow-frontend
      priority: 200
    enterpriseflow-root-https:
      rule: Path(`/`)
      entryPoints:
        - https
      middlewares:
        - ef-root-to-login
      service: enterpriseflow-frontend
      priority: 200
      tls: {}

    enterpriseflow-http:
      rule: PathPrefix(`/ef`)
      entryPoints:
        - http
      service: enterpriseflow-frontend
      priority: 120
    enterpriseflow-https:
      rule: PathPrefix(`/ef`)
      entryPoints:
        - https
      service: enterpriseflow-frontend
      priority: 120
      tls: {}

  services:
    enterpriseflow-frontend:
      loadBalancer:
        servers:
          - url: "http://ef-frontend:3000"
