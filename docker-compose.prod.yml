# Production-oriented stack. Secrets via env file — never commit real values.
#   cp deploy/prod.env.example deploy/prod.env   # edit secrets
#   docker compose -f docker-compose.prod.yml --env-file deploy/prod.env up -d --build
#
# Host ports: API 8010, UI 3010 (Coolify owns :8000 on this VPS).

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enterpriseflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-enterpriseflow}
    volumes:
      - ef_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enterpriseflow} -d ${POSTGRES_DB:-enterpriseflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # no host port publish in prod compose

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - ef_redis_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-8010}:8000"
    environment:
      APP_NAME: EnterpriseFlow AI
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOME: /home/app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-enterpriseflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enterpriseflow}
      REDIS_URL: redis://redis:6379/0
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.5}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-file:/app/mlruns}
      MLFLOW_EXPERIMENT: ${MLFLOW_EXPERIMENT:-enterpriseflow}
      EF_JWT_SECRET: ${EF_JWT_SECRET:?set EF_JWT_SECRET}
      EF_AUTH_REQUIRED: ${EF_AUTH_REQUIRED:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DATABRICKS_HOST: ${DATABRICKS_HOST:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
    volumes:
      - ef_mlruns_prod:/app/mlruns
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3010}:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: /backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  # Optional: MCP-labeled replica (same image as API). Enable with --profile mcp
  mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: mcp/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      HOME: /home/app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-enterpriseflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enterpriseflow}
      REDIS_URL: redis://redis:6379/0
      EF_JWT_SECRET: ${EF_JWT_SECRET:?set EF_JWT_SECRET}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-file:/app/mlruns}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optional one-shot eval worker: docker compose -f docker-compose.prod.yml run --rm worker
  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-enterpriseflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enterpriseflow}
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-file:/app/mlruns}
      MLFLOW_EXPERIMENT: ${MLFLOW_EXPERIMENT:-enterpriseflow}
    volumes:
      - ef_mlruns_prod:/app/mlruns
    depends_on:
      db:
        condition: service_healthy

volumes:
  ef_pgdata_prod:
  ef_redis_prod:
  ef_mlruns_prod:
