# CI — lint, tests, Docker build (no secrets required for default file-store path)
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: enterpriseflow
          POSTGRES_PASSWORD: enterpriseflow
          POSTGRES_DB: enterpriseflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U enterpriseflow -d enterpriseflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://enterpriseflow:enterpriseflow@localhost:5432/enterpriseflow
      REDIS_URL: redis://localhost:6379/0
      EF_DB_TESTS: "1"
      EF_JWT_SECRET: ci-test-jwt-secret-not-for-prod
      EF_MLFLOW: "0"
      MLFLOW_TRACKING_URI: file:./mlruns
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Pytest
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: enterpriseflow-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: enterpriseflow-frontend:ci
          build-args: |
            API_INTERNAL_URL=http://api:8000
            NEXT_BASE_PATH=/ef
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp/Dockerfile
          push: false
          tags: enterpriseflow-mcp:ci
